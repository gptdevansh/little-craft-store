<div class="flex items-center gap-2 bg-surface-container px-4 py-2 rounded-full border border-outline-variant/30">

</div>
<p class="font-body-md text-body-md text-on-surface-variant mt-2 max-w-[280px]">
                Have a question about a handcrafted piece or a custom order? We'd love to hear from you.
            </p>
</section>
<!-- Primary Action: WhatsApp -->
<section class="flex flex-col items-center w-full">
<a aria-label="Chat on WhatsApp" class="w-full flex items-center justify-center gap-3 bg-tertiary text-on-tertiary rounded-full py-4 px-6 shadow-md active:scale-95 transition-transform duration-200 min-h-[64px] text-lg font-medium" href="#">

<span>Chat on WhatsApp</span>
</a>
<span class="font-label-sm text-label-sm text-on-surface-variant mt-4 opacity-70">+1 (555) 123-4567</span>
</section>
