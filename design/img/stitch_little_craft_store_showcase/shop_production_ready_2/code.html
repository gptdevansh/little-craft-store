<!DOCTYPE html>

<body class="bg-background text-on-background min-h-screen pb-[80px]">
<!-- Top Navigation -->
<header class="w-full top-0 sticky bg-surface dark:bg-surface-container-low flex justify-between items-center px-container-margin h-touch-target z-50 flat">
<button class="flex items-center justify-center w-touch-target h-touch-target cursor-pointer active:scale-95 text-[#7B2E6B] dark:text-primary-fixed hover:text-primary-container transition-colors">
<span class="material-symbols-outlined" data-icon="arrow_back">arrow_back</span>
</button>
<div class="font-headline-md text-headline-md text-[#7B2E6B] dark:text-primary-fixed">
            Shop
        </div>
<div class="w-touch-target"></div> <!-- Spacer for centering -->
</header>
<main class="px-container-margin pt-unit space-y-gutter">
<!-- Category Filters -->
<div class="overflow-x-auto no-scrollbar py-unit">
<div class="flex space-x-unit min-w-max pb-2 px-1">
<!-- Active Chip -->
<button class="h-touch-target px-6 rounded-full bg-[#7B2E6B] text-white font-label-sm text-label-sm flex items-center justify-center active:scale-95 transition-all">
                    All
                </button>
<!-- Inactive Chips -->
<button class="h-touch-target px-6 rounded-full border border-[#F3C9DE] text-[#7B2E6B] bg-white font-label-sm text-label-sm flex items-center justify-center active:scale-95 transition-all">
                    Scrunchies
                </button>
<button class="h-touch-target px-6 rounded-full border border-[#F3C9DE] text-[#7B2E6B] bg-white font-label-sm text-label-sm flex items-center justify-center active:scale-95 transition-all">
                    Hair Bands
                </button>
<button class="h-touch-target px-6 rounded-full border border-[#F3C9DE] text-[#7B2E6B] bg-white font-label-sm text-label-sm flex items-center justify-center active:scale-95 transition-all">
                    Clips
                </button>
<button class="h-touch-target px-6 rounded-full border border-[#F3C9DE] text-[#7B2E6B] bg-white font-label-sm text-label-sm flex items-center justify-center active:scale-95 transition-all">
                    Accessories
                </button>
</div>
</div>
<!-- Product Grid -->
<div class="grid grid-cols-2 gap-gutter mt-unit pb-8 items-start">
<!-- Product Card 1 (Portrait) -->
<div class="flex flex-col bg-white rounded-lg overflow-hidden border border-[#F3C9DE]/50 relative">

</div>
<div class="p-unit flex flex-col flex-grow">
<h3 class="font-body-md text-body-md text-on-surface line-clamp-2 mb-1">Meadow Floral Scrunchie</h3>
<p class="font-label-sm text-label-sm text-[#7B2E6B] mb-3">$14.00</p>
<div class="mt-auto">
<button class="w-full h-touch-target rounded-full bg-[#7B2E6B] text-white hover:bg-[#5F1553] transition-colors font-label-sm text-label-sm flex items-center justify-center gap-2">
<span class="material-symbols-outlined text-[18px]" data-icon="forum">forum</span> Order
                        </button>
</div>
</div>
</div>
<!-- Product Card 2 (Square) -->
<div class="flex flex-col bg-[#F3C9DE]/20 rounded-lg overflow-hidden border border-[#F3C9DE]/50 mt-[32px] relative"> <!-- Offset for organic look -->
<div class="aspect-square w-full bg-surface-container-low overflow-hidden">
<img class="w-full h-full object-cover" data-alt="A delicate velvet hair bow in a rich plum color, displayed on a piece of vintage parchment paper. Next to it are small dried baby's breath flowers. Soft, warm lighting creating a romantic, handcrafted boutique atmosphere." src="https://lh3.googleusercontent.com/aida-public/AB6AXuBThLuG9jtyNiNrtRrW4CNTrtwQb-iR2Z9Gcap1iwaFZruJMSZUd5G1PeYRmBtHQ56shrPjr33fUJ7bGBf675jpi-slEE1DppbI7iJ9dKIDaOmGEe7pwd0eYW55W98WmDKG-QTc-zveU7M0Gg6S0jii2siLAP6kXVFP8Z6dsr5VuufquUj5e_PKHtZi_eejbUfAwoNsl48LdZv0HurqNUnqHGj5dSUhvBxvKGupUgde2PGOByoqYy0Hyg"/>
</div>
<div class="p-unit flex flex-col flex-grow">
<div class="flex items-center gap-1 mb-1">
<span class="material-symbols-outlined text-[12px] text-[#8FA876]" data-icon="eco">eco</span>
<span class="text-[10px] uppercase text-[#8FA876] font-semibold tracking-wider">Hand-stitched</span>
</div>
<h3 class="font-body-md text-body-md text-on-surface line-clamp-2 mb-1">Velvet Plum Bow</h3>
<p class="font-label-sm text-label-sm text-[#7B2E6B] mb-3">$22.00</p>
<div class="mt-auto">
<button class="w-full h-touch-target rounded-full bg-[#7B2E6B] text-white hover:bg-[#5F1553] transition-colors font-label-sm text-label-sm flex items-center justify-center gap-2">
<span class="material-symbols-outlined text-[18px]" data-icon="forum">forum</span> Order
                        </button>
</div>
</div>
</div>
<!-- Product Card 3 (Square) -->
<div class="flex flex-col bg-white rounded-lg overflow-hidden border border-[#F3C9DE]/50 relative">
<div class="aspect-square w-full bg-surface-container-low overflow-hidden">
<img class="w-full h-full object-cover" data-alt="A set of three minimalist metal hair clips with subtle pearl embellishments. They are arranged neatly on a pale pink linen cloth. The lighting is soft and diffused, emphasizing the premium, handcrafted nature of the accessories." src="https://lh3.googleusercontent.com/aida-public/AB6AXuB4ZLJfXpei3z2YtFwuG9RyEvkLmaoL-iCJhkV2Rmm_lKpp4ycWhNa2aYETMhir0ltLaoRsPG1_6dOkQ1SlYOT22mLIudvri07KCD7OcmBDGpq2r8EkkVZH43_-0Bdjns3SV_G9VkxMPW98Wf955doxR7mkMUsk4F-6RonBmhJCO6YBccILab14Bt2mUYI2CG2yPWaj4_tlrkcZMUSkE31QQSoBokWSeWh1m3ecM1vEkeLrXyeIOKw-Pg"/>
</div>
<div class="p-unit flex flex-col flex-grow">
<h3 class="font-body-md text-body-md text-on-surface line-clamp-2 mb-1">Pearl Clip Set</h3>
<p class="font-label-sm text-label-sm text-[#7B2E6B] mb-3">$18.00</p>
<div class="mt-auto">
<button class="w-full h-touch-target rounded-full bg-[#7B2E6B] text-white hover:bg-[#5F1553] transition-colors font-label-sm text-label-sm flex items-center justify-center gap-2">
<span class="material-symbols-outlined text-[18px]" data-icon="forum">forum</span> Order
                        </button>
</div>
</div>
</div>
<!-- Product Card 4 (Portrait) -->
<div class="flex flex-col bg-white rounded-lg overflow-hidden border border-[#F3C9DE]/50 mt-[32px] relative">
<div class="aspect-[4/5] w-full bg-surface-container-low overflow-hidden">
<img class="w-full h-full object-cover" data-alt="A wide, textured linen headband in a natural oat color, placed on a smooth stone surface with a soft shadow cast by a nearby leaf. The scene is calm, organic, and minimalist, perfect for a handcrafted boutique." src="https://lh3.googleusercontent.com/aida-public/AB6AXuAYd6Wboc-2kAOJ0xlIdJxYYtL05HwMZy8fqsSqG3ylO8PXYV-238tbKnYgNHCoQ9ld6CjCnklTM0KPc99zX7o4gUp41-Nj-O-MGKU0BZfcD4Ip6k84_oQrvZHH-Ni22dqERlEuIN4cKN_KpczFJsXj1OD0bhDVKM3VsYzhQb2yxG8TPkvWgCnIRbl8pkX3YDYexwpv-E7SnhlYQKHE9VyL0qzm-DTWbMNJj0o-MIsxWjLMVLPfVmeI4Q"/>

<p class="font-label-sm text-label-sm text-[#7B2E6B] mb-3">$25.00</p>
<div class="mt-auto">
<button class="w-full h-touch-target rounded-full bg-[#7B2E6B] text-white hover:bg-[#5F1553] transition-colors font-label-sm text-label-sm flex items-center justify-center gap-2">
<span class="material-symbols-outlined text-[18px]" data-icon="forum">forum</span> Order
                        </button>
</div>
</div>
</div>
</div>
</main>
<style>
        /* Hide scrollbar for category chips but keep functionality */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;  /* IE and Edge */
            scrollbar-width: none;  /* Firefox */
        }
    </style>
</body></html>
